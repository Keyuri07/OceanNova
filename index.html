<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OceanView3D</title>

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="panel">
    <h1>🌊 OceanView3D</h1>
    
    <label>Depth: <strong id="depthValue">100 m</strong></label>
    <input type="range" id="depthSlider" min="0" max="3" value="1">
    
    <label>Time: <strong id="timeValue">2025-01-01</strong></label>
    <input type="range" id="timeSlider" min="0" max="4" value="0">
    
    <button id="playButton">▶ Play</button>
    <button id="resetButton">Reset</button>
    <div class="speed-control">
    <label for="speedSlider">Speed:</label>

    <input
        type="range"
        id="speedSlider"
        min="1"
        max="10"
        value="5"
        step="1"
    />

    <span id="speedValue">5x</span>
</div>
    <div id="colorbar">
      <div class="gradient"></div>
      <div>
        <span id="minValue">-- °C</span>
        <span id="maxValue">-- °C</span>
      </div>
    </div>
    
    <p id="status">Ready</p>
  </div>
  
  <div id="loading" style="display:none;">Loading...</div>
  <div id="error" style="display:none;"></div>
  <div id="cesiumContainer"></div>
  <div id="loadingSpinner" style="display: none;">
    <div class="spinner"></div>
    <p>Loading data...</p>
</div>
  <script src="script.js"></script>
</body>
</html>
